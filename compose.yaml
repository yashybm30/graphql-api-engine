services:
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/graphql_portfolio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 48 random characters}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  mongo:
